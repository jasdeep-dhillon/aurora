<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Aurora: one curtain of light, brightest at its lower edge and fading
       upward. White on transparent; the app tints it with the theme's text
       color (and draws it on a dark tile for the window icon). -->
  <defs>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="50" x2="0" y2="8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M6 46 C18 54 30 50 40 40 C46 34 52 30 58 30 L54 8 C49 9 45 12 40 17 C31 26 21 30 11 25 Z" fill="url(#fade)"/>
  <path d="M6 46 C18 54 30 50 40 40 C46 34 52 30 58 30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</svg>
