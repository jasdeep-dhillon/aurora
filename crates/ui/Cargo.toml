[package]
name = "ui"
description = "Design system: theme tokens, presets and reusable widgets"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
egui = { workspace = true, features = ["serde"] }
serde.workspace = true
i18n.workspace = true
# Renders the Aurora SVG into the window/tray icon (same resvg egui_extras uses).
resvg = { version = "0.45", default-features = false }

[dev-dependencies]
image.workspace = true
